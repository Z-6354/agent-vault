name: Cross-platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install actual package
        run: python -m pip install .
      - name: Unit and real HTTP/stdio integration tests
        run: python -B -W error::ResourceWarning -m unittest discover -s tests -v
      - name: End-to-end acceptance with synthetic data
        run: python -B scripts/acceptance.py
      - name: Installed entry point
        run: agent-vault --help

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Verify clean wheel installation
        shell: bash
        run: |
          python -m venv /tmp/vault-wheel
          /tmp/vault-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/vault-wheel/bin/agent-vault --help
          /tmp/vault-wheel/bin/python -c "from importlib.resources import files; assert files('agent_vault').joinpath('web/index.html').is_file()"
          /tmp/vault-wheel/bin/python "$GITHUB_WORKSPACE/scripts/install_smoke.py"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  browser:
    name: Chromium browser flow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install .
      - name: Browser login, remembered restart, enrollment and logout
        env:
          VAULT_TEST_NO_SANDBOX: '1'
        run: python -B scripts/browser_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: ../browser-evidence/*.png
          if-no-files-found: ignore
